<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Layout</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ"
        crossorigin="anonymous">
</head>

<body style="background-color: rgb(9, 27, 19);">
    <!-- mt = margin top / jarak bagian atas -->
    <!-- mb = margin bottom / jarak bagian bawah -->

    <div class="container-fluid" style="background-color: hsl(0, 0%, 0%);">
        <div class="container mt-0 mb-5" style="background-color: hsl(0, 0%, 0%);">
            <div class="py-3">
                <h1
                    class="text-white"
                    style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman';">
                    ʜᴇʟʟᴏ, ʙᴇᴀᴜᴛɪꜰᴜʟ ꜱᴏᴜʟꜱ
                </h1>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="container">
            <div class="row mb-3">
                <div class="col-2">
                    <span class="placeholder col-12"></span>
                </div>
            </div>

            <!-- 1 kolom di HP, 2 kolom mulai md, 3 kolom mulai lg -->
            <div class="row g-4 mb-5">
                <div class="col-12 col-md-6 col-lg-4">
                    <img
                        class="img-fluid"
                        src="https://i.pinimg.com/736x/fb/02/13/fb02139ca1fff2b082397b7ecddebefc.jpg"
                        alt=""
                        style="width: 100%; height: auto;">
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <img
                        class="img-fluid"
                        src="https://i.pinimg.com/736x/ab/cb/a7/abcba71e1e62c9efb1e98b462058ce4c.jpg"
                        alt=""
                        style="width: 100%; height: auto;">
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <img
                        class="img-fluid"
                        src="https://i.pinimg.com/736x/e1/3d/6b/e13d6bee463ca5fb81301767baaaf46e.jpg"
                        alt=""
                        style="width: 100%; height: auto;">
                </div>
            </div>
        </div>
    </div>

    <br>
    <br>

    <div class="container-fluid">
        <div class="container">
            <div class="row mb-5">
                <div class="col-2">
                    <span class="placeholder col-12"></span>
                </div>
            </div>

            <div class="row g-4 mb-5">
                <div class="col-12 col-md-6 col-lg-4">
                    <img
                        class="img-fluid mb-2 d-block"
                        src="https://i.pinimg.com/736x/27/30/8f/27308f1558ea7c7f9a4167a4887aaff3.jpg"
                        alt=""
                        style="width: auto; height: auto; max-height: 100px;">

                    <span class="placeholder col-4 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <img
                        class="img-fluid mb-2 d-block"
                        src="https://i.pinimg.com/736x/05/c1/26/05c126afc183a5bf5b229dfb3c965b61.jpg"
                        alt=""
                        style="width: auto; height: auto; max-height: 100px;">

                    <span class="placeholder col-4 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <img
                        class="img-fluid mb-2 d-block"
                        src="https://i.pinimg.com/736x/0d/cc/d5/0dccd5b74c6c4850069e78d9c7daa39c.jpg"
                        alt=""
                        style="width: auto; height: auto; max-height: 100px;">

                    <span class="placeholder col-4 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                    <span class="placeholder col-10 mb-1"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid" style="background-color: hsl(130, 9%, 13%);">
        <div class="container">
            <div class="row">
                <div class="col-12 text-center text-black p-3 p-md-5">

                    <p style="color: rgb(111, 228, 100);">
                        𝒯𝒽𝒶𝓃𝓀 𝓎𝑜𝓊 𝒻𝑜𝓇 𝓅𝒶𝒾𝓃𝓉𝒾𝓃𝑔 𝓉𝒽𝒾𝓈 𝓂𝑜𝓂𝑒𝓃𝓉 𝒾𝓃 𝓈𝒽𝒶𝒹𝑒𝓈 𝑜𝒻 𝑔𝓇𝑒𝑒𝓃 𝒶𝓃𝒹 𝓅𝑒𝒶𝒸𝑒. 🌿
                    </p>

                    <p style="color: rgb(9, 67, 1);">ʙʏ ᴛʜɪɴᴇ</p>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
        crossorigin="anonymous">
    </script>
</body>
</html>
